name: Verify QuizDock
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: npm install --ignore-scripts
      - name: Bundle Worker without publishing
        run: npx wrangler deploy --dry-run --outdir /tmp/quizdock-worker
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run-browser-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-browser-checks
          retention-days: 7
          path: |
            checks/*-results.json
            checks/*.png
